[package]
name = "onyx-midi-bridge"
version = "0.1.0"
description = "MIDI-to-OSC bridge for Obsidian Onyx, with MIDI Learn mapping"
edition = "2021"

[lib]
name = "onyx_midi_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"
rosc = "0.10"
anyhow = "1"
